<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#244B77"/>
      <stop offset="100%" style="stop-color:#1a3a5c"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="url(#bgGradient)"/>
  <!-- Clock circle -->
  <circle cx="16" cy="16" r="9" stroke="white" stroke-width="2" fill="none"/>
  <!-- Clock hands -->
  <line x1="16" y1="16" x2="16" y2="10" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="21" y2="16" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.5" fill="white"/>
  <!-- Accent dot -->
  <circle cx="26" cy="6" r="4" fill="url(#accentGradient)"/>
</svg>

